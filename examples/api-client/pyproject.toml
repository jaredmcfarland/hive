# API Client Example - Hive Service Integration
# Demonstrates @service decorator, httpx integration, and credential management

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-client-example"
version = "0.1.0"
description = "Hive example demonstrating external API integration with services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "hive-framework>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
api-client = "api_client:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/api_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
hive-framework = { path = "../..", editable = true }

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
