[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trakr"
version = "0.1.0"
description = "A Hive application"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Unknown" }
]
dependencies = [
    "hive-framework>=0.1.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
    "deepdiff>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
trakr = "trakr.app:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/trakr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/trakr/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv.sources]
hive-framework = { path = "../..", editable = true }
