[project]
name = "minimal"
version = "0.1.0"
description = "Minimal Hive application example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hive @ file:///${PROJECT_ROOT}/../..",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
