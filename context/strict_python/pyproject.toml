# =============================================================================
# STRICT PYTHON PROJECT CONFIGURATION
# =============================================================================
# This configuration enforces maximum type safety, linting strictness, and
# code quality standards to create an "agent-ready" Python codebase.
#
# Goals:
# - Eliminate runtime type errors through static analysis
# - Enforce consistent code style and formatting
# - Require comprehensive documentation
# - Enable confident automated refactoring
# - Maximize code discoverability and grep-ability
# =============================================================================

[project]
name = "your-project-name"
version = "0.1.0"
description = "A strictly-typed, agent-ready Python project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["typed", "strict"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    # Static analysis
    "pyright>=1.1.390",

    # Linting and formatting
    "ruff>=0.8.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",        # Parallel test execution
    "hypothesis>=6.100.0",         # Property-based testing
    "mutmut>=3.2.0",               # Mutation testing

    # Documentation coverage
    "interrogate>=1.7.0",

    # Dead code detection
    "vulture>=2.14",

    # Architecture enforcement
    "import-linter>=2.1",

    # Security
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",

    # Git hooks
    "pre-commit>=4.0.0",

    # Runtime type checking (optional, for debugging)
    "beartype>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/your-project"
Documentation = "https://github.com/yourorg/your-project#readme"
Repository = "https://github.com/yourorg/your-project.git"
Issues = "https://github.com/yourorg/your-project/issues"

# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/your_project"]

# =============================================================================
# PYRIGHT - STATIC TYPE CHECKING
# =============================================================================
# Pyright is preferred over mypy for:
# - Faster analysis
# - Stricter defaults
# - Better IDE integration (Pylance)
# - More accurate type narrowing
# - Better support for modern Python typing features
#
# We use "strict" mode and enable additional checks beyond the default strict.
# =============================================================================

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"

# Use src layout
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.git",
    "**/build",
    "**/dist",
    "**/.venv",
    "**/venv",
]

# Maximum strictness
typeCheckingMode = "strict"

# Additional strict checks beyond "strict" mode
reportMissingTypeStubs = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportDuplicateImport = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "warning"
reportImportCycles = "warning"
reportPropertyTypeMismatch = "error"
reportShadowedImports = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnsupportedDunderAll = "error"
reportWildcardImportFromLibrary = "error"

# =============================================================================
# RUFF - LINTING AND FORMATTING
# =============================================================================
# Ruff consolidates:
# - Flake8 (and 50+ plugins)
# - isort
# - pyupgrade
# - autoflake
# - Black (formatting)
# - pydocstyle
# - pylint (partial)
# - bandit (partial)
#
# We enable nearly all rules and explicitly disable only those that conflict
# or are inappropriate for our use case.
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# Exclude common non-source directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Start with ALL rules enabled, then selectively disable
select = ["ALL"]

ignore = [
    # ----- Conflicting rules -----
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D212",    # multi-line-summary-first-line (conflicts with D213)
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)

    # ----- Rules incompatible with our style -----
    "D100",    # Missing docstring in public module (we use __init__.py for this)
    "D104",    # Missing docstring in public package
    "D106",    # Missing docstring in public nested class
    "D107",    # Missing docstring in __init__ (redundant with class docstring)

    # ----- Overly pedantic for our use case -----
    "ANN401",  # Dynamically typed expressions (Any) - we allow explicit Any sparingly
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "FIX002",  # Line contains TODO - we allow TODOs

    # ----- Conflicts with Pydantic patterns -----
    "RUF012",  # Mutable class attributes should be annotated with ClassVar

    # ----- Personal preference -----
    "E501",    # Line too long (handled by formatter, with exceptions for URLs etc.)
]

# Allow these to be fixed automatically
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and don't need docstrings for every function
"tests/**/*.py" = [
    "S101",    # Use of assert
    "PLR2004", # Magic value comparisons
    "D103",    # Missing docstring in public function
    "ANN",     # Type annotations (tests are more lenient)
    "ARG001",  # Unused function argument (fixtures)
    "ARG002",  # Unused method argument
]
# Allow print in scripts and CLI
"scripts/**/*.py" = ["T201"]
# __init__.py can have unused imports (re-exports)
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["your_project"]
force-single-line = false
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

# =============================================================================
# PYTEST - TESTING
# =============================================================================
# Configuration for comprehensive, strict testing with coverage requirements.
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

# Strict mode: fail on warnings, unknown markers, etc.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",                          # Show summary of all non-passing tests
    "--tb=short",                   # Shorter tracebacks
    "-q",                           # Quieter output
    "--cov=src",                    # Coverage for src directory
    "--cov-report=term-missing",    # Show missing lines
    "--cov-report=html",            # HTML report
    "--cov-report=xml",             # XML for CI
    "--cov-fail-under=90",          # Minimum coverage percentage
]

# Treat warnings as errors
filterwarnings = [
    "error",
    # Ignore specific warnings from dependencies if needed
    # "ignore::DeprecationWarning:some_module.*",
]

# Custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Async support (if using async code)
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
]

[tool.coverage.paths]
source = [
    "src/",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    # Standard exclusions
    "pragma: no cover",
    "def __repr__",
    "def __str__",

    # Type checking imports
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",

    # Abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",
    "raise NotImplementedError",

    # Defensive assertions
    "assert_never",
    "typing_extensions.assert_never",

    # Debug/development code
    "if __name__ == .__main__.:",
    "if DEBUG:",
    "if settings.DEBUG:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# HYPOTHESIS - PROPERTY-BASED TESTING
# =============================================================================

[tool.hypothesis]
# Default profile
default = "default"

[tool.hypothesis.profiles.default]
max_examples = 100
deadline = 500  # milliseconds

[tool.hypothesis.profiles.ci]
max_examples = 1000
deadline = 1000

[tool.hypothesis.profiles.dev]
max_examples = 10
deadline = 5000

# =============================================================================
# MUTMUT - MUTATION TESTING
# =============================================================================
# Mutation testing verifies that your tests actually catch bugs by introducing
# small changes (mutations) and ensuring tests fail.
# =============================================================================

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "pytest"
dict_synonyms = "Struct, NamedStruct"

# =============================================================================
# INTERROGATE - DOCSTRING COVERAGE
# =============================================================================
# Ensures comprehensive documentation coverage.
# =============================================================================

[tool.interrogate]
fail-under = 95
verbose = 1
quiet = false
color = true
omit-covered-files = false

# What to check
ignore-init-method = true      # __init__ can rely on class docstring
ignore-init-module = true      # __init__.py module docstrings
ignore-magic = true            # __repr__, __str__, etc.
ignore-semiprivate = false     # _private methods still need docs
ignore-private = true          # __private methods
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = true

exclude = [
    "setup.py",
    "conftest.py",
    "tests",
    "docs",
]

# =============================================================================
# VULTURE - DEAD CODE DETECTION
# =============================================================================

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = [
    "*/.venv/*",
    "*/tests/*",
]
# Whitelist file for false positives
# whitelist = "vulture_whitelist.py"

# =============================================================================
# IMPORT-LINTER - ARCHITECTURE ENFORCEMENT
# =============================================================================
# Enforces dependency rules between modules to maintain clean architecture.
# Customize these contracts based on your project structure.
# =============================================================================

[tool.importlinter]
root_package = "your_project"

[[tool.importlinter.contracts]]
name = "Models should not import from services"
type = "forbidden"
source_modules = ["your_project.models"]
forbidden_modules = ["your_project.services"]

[[tool.importlinter.contracts]]
name = "Services can import from models but not vice versa"
type = "layers"
layers = [
    "your_project.services",
    "your_project.models",
]

# =============================================================================
# BANDIT - SECURITY LINTING
# =============================================================================
# Note: Many bandit checks are included in ruff (S* rules), but we include
# bandit configuration for completeness and additional CI checks.
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = [
    # Skip specific checks if needed
    # "B101",  # assert_used - we want this in production for assert_never
]

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/conftest.py"]

# =============================================================================
# PIP-AUDIT - VULNERABILITY SCANNING
# =============================================================================

# Run with: pip-audit --strict --vulnerability-service osv

# =============================================================================
# VERSION MANAGEMENT (Optional - if using version control)
# =============================================================================

# If using hatch-vcs for version management:
# [tool.hatch.version]
# source = "vcs"
#
# [tool.hatch.build.hooks.vcs]
# version-file = "src/your_project/_version.py"
