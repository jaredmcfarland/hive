# =============================================================================
# PRE-COMMIT HOOKS CONFIGURATION
# =============================================================================
# These hooks run automatically before each commit to catch issues early.
# Install with: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # Ruff - Linting and Formatting (fast, comprehensive)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # ---------------------------------------------------------------------------
  # Pyright - Static Type Checking
  # ---------------------------------------------------------------------------
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.391
    hooks:
      - id: pyright
        name: pyright (typecheck)
        # Add your typed dependencies here so pyright can resolve them
        additional_dependencies:
          - pydantic>=2.10.0
          # Add other dependencies that need type checking:
          # - httpx
          # - sqlalchemy[mypy]

  # ---------------------------------------------------------------------------
  # Interrogate - Docstring Coverage
  # ---------------------------------------------------------------------------
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: interrogate (docstrings)
        args: [-vv, --fail-under=95]

  # ---------------------------------------------------------------------------
  # Standard Pre-commit Hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Whitespace and file formatting
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of files
      - id: mixed-line-ending
        name: fix mixed line endings
        args: [--fix=lf]

      # File validation
      - id: check-yaml
        name: check yaml syntax
      - id: check-toml
        name: check toml syntax
      - id: check-json
        name: check json syntax
      - id: check-xml
        name: check xml syntax

      # Git hygiene
      - id: check-added-large-files
        name: check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-case-conflict
        name: check for case conflicts
      - id: no-commit-to-branch
        name: protect main branch
        args: [--branch, main, --branch, master]

      # Security basics
      - id: detect-private-key
        name: detect private keys

      # Python specific
      - id: check-ast
        name: check python ast
      - id: debug-statements
        name: check for debug statements
      - id: check-docstring-first
        name: check docstring is first

  # ---------------------------------------------------------------------------
  # Security - Bandit
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        name: bandit (security)
        args: [-c, pyproject.toml, -r, src/]
        additional_dependencies: ["bandit[toml]"]

  # ---------------------------------------------------------------------------
  # Validate pyproject.toml
  # ---------------------------------------------------------------------------
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject
        name: validate pyproject.toml

  # ---------------------------------------------------------------------------
  # Typos - Spell Checking for Code
  # ---------------------------------------------------------------------------
  - repo: https://github.com/crate-ci/typos
    rev: v1.29.4
    hooks:
      - id: typos
        name: typos (spell check)

  # ---------------------------------------------------------------------------
  # Commitizen - Conventional Commits (optional)
  # ---------------------------------------------------------------------------
  # Uncomment to enforce conventional commit messages
  # - repo: https://github.com/commitizen-tools/commitizen
  #   rev: v3.29.0
  #   hooks:
  #     - id: commitizen
  #       name: commitizen (commit message)
  #       stages: [commit-msg]

# =============================================================================
# CI Configuration
# =============================================================================
# Settings for pre-commit.ci (if using their service)
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: monthly
  skip: []
  submodules: false
