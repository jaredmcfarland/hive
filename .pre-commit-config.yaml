# =============================================================================
# PRE-COMMIT HOOKS CONFIGURATION
# =============================================================================
# These hooks run automatically before each commit to catch issues early.
# Install with: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
# Update hooks: uv run pre-commit autoupdate
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # Ruff - Linting and Formatting (fast, comprehensive)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # ---------------------------------------------------------------------------
  # Pyright - Static Type Checking
  # ---------------------------------------------------------------------------
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.391
    hooks:
      - id: pyright
        name: pyright (typecheck)
        additional_dependencies:
          - pydantic>=2.0.0
          - pydantic-settings>=2.0.0
          - typer>=0.9.0
          - rich>=13.0.0
          - sqlmodel>=0.0.22
          - aiosqlite>=0.19.0
          - beartype>=0.18.0
          - deal>=4.24.0

  # ---------------------------------------------------------------------------
  # Interrogate - Docstring Coverage
  # ---------------------------------------------------------------------------
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: interrogate (docstrings)
        args: [-vv, --fail-under=95]

  # ---------------------------------------------------------------------------
  # Standard Pre-commit Hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Whitespace and file formatting
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of files
      - id: mixed-line-ending
        name: fix mixed line endings
        args: [--fix=lf]

      # File validation
      - id: check-yaml
        name: check yaml syntax
      - id: check-toml
        name: check toml syntax
      - id: check-json
        name: check json syntax

      # Git hygiene
      - id: check-added-large-files
        name: check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-case-conflict
        name: check for case conflicts
      - id: no-commit-to-branch
        name: protect main branch
        args: [--branch, main, --branch, master]

      # Security basics
      - id: detect-private-key
        name: detect private keys

      # Python specific
      - id: check-ast
        name: check python ast
      - id: debug-statements
        name: check for debug statements
      - id: check-docstring-first
        name: check docstring is first

  # ---------------------------------------------------------------------------
  # Security - Bandit
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        name: bandit (security)
        args: [-c, pyproject.toml, -r, src/]
        additional_dependencies: ["bandit[toml]"]

  # ---------------------------------------------------------------------------
  # Validate pyproject.toml
  # ---------------------------------------------------------------------------
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject
        name: validate pyproject.toml

  # ---------------------------------------------------------------------------
  # Typos - Spell Checking for Code
  # ---------------------------------------------------------------------------
  - repo: https://github.com/crate-ci/typos
    rev: v1.29.4
    hooks:
      - id: typos
        name: typos (spell check)

# =============================================================================
# CI Configuration
# =============================================================================
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: monthly
  skip: [pyright]  # Skip pyright in pre-commit.ci (run in main CI instead)
  submodules: false
