# =============================================================================
# HIVE FRAMEWORK - STRICT PYTHON CONFIGURATION
# =============================================================================
# Terminal-agent-native application framework with maximum type safety,
# linting strictness, and code quality standards.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hive-framework"
version = "0.1.0"
description = "A framework for building terminal-agent-native applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Jared McFarland" }
]
keywords = ["cli", "tui", "framework", "typer", "textual", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=2.0.0",
    # Verification stack
    "beartype>=0.18.0",
    "deal>=4.24.0",
    # TUI and services (Phase 2)
    "textual>=0.50.0",
    "keyring>=25.0.0",
    "httpx>=0.27.0",
    # Specification and distribution (Phase 3)
    "deepdiff>=8.0.0",
    "watchfiles>=1.0.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
hive = "hive.cli.main:cli"

[project.optional-dependencies]
mcp = [
    # MCP server generation - optional
    "fastmcp>=2.0,<3",
]
rest = [
    # REST API generation - optional
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    # Static analysis
    "pyright>=1.1.390",

    # Linting and formatting
    "ruff>=0.8.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "mutmut>=3.2.0",

    # Documentation coverage
    "interrogate>=1.7.0",

    # Dead code detection
    "vulture>=2.14",

    # Architecture enforcement
    "import-linter>=2.1",

    # Security
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",

    # Git hooks
    "pre-commit>=4.0.0",

    # TUI testing
    "pytest-textual-snapshot>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jaredmcfarland/hive"
Documentation = "https://hive.dev/docs"
Repository = "https://github.com/jaredmcfarland/hive"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

# =============================================================================
# PYRIGHT - STATIC TYPE CHECKING
# =============================================================================

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"
stubPath = "typings"

# Use src layout
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.git",
    "**/build",
    "**/dist",
    "**/.venv",
    "**/venv",
]

# Maximum strictness
typeCheckingMode = "strict"

# Additional strict checks beyond "strict" mode
reportMissingTypeStubs = "warning"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportDuplicateImport = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "warning"  # Pydantic/dict type narrowing
reportUnnecessaryTypeIgnoreComment = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "warning"
reportImportCycles = "warning"
reportPropertyTypeMismatch = "error"
reportUnsupportedDunderAll = "error"
reportWildcardImportFromLibrary = "error"

# ----- Relaxed for beartype/deal lambda validators -----
# These libraries use dynamic lambdas that pyright cannot infer types for.
# The code is correct and tests pass - these are static analysis limitations.
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"

# =============================================================================
# RUFF - LINTING AND FORMATTING
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "context",  # Reference materials, not project code
]

[tool.ruff.lint]
# Start with ALL rules enabled, then selectively disable
select = ["ALL"]

ignore = [
    # ----- Conflicting rules -----
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D212",    # multi-line-summary-first-line (conflicts with D213)
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)

    # ----- Rules incompatible with our style -----
    "D100",    # Missing docstring in public module (we use __init__.py for this)
    "D104",    # Missing docstring in public package
    "D106",    # Missing docstring in public nested class
    "D107",    # Missing docstring in __init__ (redundant with class docstring)

    # ----- Overly pedantic for our use case -----
    "ANN401",  # Dynamically typed expressions (Any) - we allow explicit Any sparingly
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "FIX002",  # Line contains TODO - we allow TODOs

    # ----- Conflicts with Pydantic/SQLModel patterns -----
    "RUF012",  # Mutable class attributes should be annotated with ClassVar

    # ----- Personal preference -----
    "E501",    # Line too long (handled by formatter)

    # ----- Type checking import rules (we prefer explicit imports for clarity) -----
    "TC001",   # Move import to TYPE_CHECKING block (prefers runtime clarity)
    "TC002",   # Move third-party import to TYPE_CHECKING block
    "TC003",   # Move standard library import to TYPE_CHECKING block

    # ----- Boolean args acceptable in framework config -----
    "FBT001",  # Boolean positional argument (used in config/settings)
    "FBT002",  # Boolean default positional argument
    "FBT003",  # Boolean positional value in function call

    # ----- Exception message rules (we prefer inline messages for context) -----
    "TRY003",  # Avoid long exception messages outside class
    "EM101",   # Exception must not use string literal
    "EM102",   # Exception must not use f-string literal
]

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and don't need docstrings for every function
"tests/**/*.py" = [
    "S101",    # Use of assert
    "PLR2004", # Magic value comparisons
    "D103",    # Missing docstring in public function
    "ANN",     # Type annotations (tests are more lenient)
    "ARG001",  # Unused function argument (fixtures)
    "ARG002",  # Unused method argument
    "PLC0415", # Late imports in tests are common for isolation
    "PT011",   # pytest.raises too broad
    "BLE001",  # Blind exception catch in tests acceptable
    "TRY003",  # Long exception messages
    "TRY301",  # Abstract raise to inner function
    "EM101",   # Exception string literal
    "EM102",   # Exception f-string
    "ERA001",  # Commented out code in tests
    "SLF001",  # Private member access in tests
    "PYI021",  # Docstring in stub file
    "PTH110",  # os.path.exists() vs Path.exists() (test utilities)
    "PTH108",  # os.unlink() vs Path.unlink()
    "PGH003",  # Use specific rule codes when ignoring type issues
]
# __init__.py can have unused imports (re-exports)
"__init__.py" = ["F401"]
# Late imports for circular dependency avoidance and lazy loading
"src/hive/app.py" = ["PLC0415", "PLR0913", "PERF401"]  # App config and validation loops
"src/hive/generators/cli.py" = ["PLC0415", "ARG001", "SLF001", "PLR0911"]  # Complex CLI generation
"src/hive/runtime/output.py" = ["PLC0415", "T201", "A002", "RUF001"]  # Output module
"src/hive/runtime/context.py" = ["PLC0415"]
"src/hive/types/introspection.py" = ["PLC0415", "BLE001", "S110", "ERA001", "C901", "PLR0912", "SLF001"]  # Complex type extraction
"src/hive/types/numeric.py" = ["PLR2004"]  # Domain constants in refinement types
"src/hive/types/primitives.py" = ["PLR2004"]  # Domain constants in refinement types
"src/hive/core/types.py" = ["A002"]  # 'help' parameter shadows builtin (common convention)
"src/hive/testing/mocks.py" = ["PYI034", "PYI036"]  # Async context manager patterns
"src/hive/testing/strategies.py" = ["BLE001", "C901"]  # Complex type strategy
# Type stubs
"typings/**/*.pyi" = ["PYI021", "UP047", "N818"]  # Stub files have different rules

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["hive"]
force-single-line = false
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "sqlmodel.SQLModel",
]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

# =============================================================================
# PYTEST - TESTING
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]

filterwarnings = [
    "error",
    # Ignore specific warnings from dependencies
    "ignore::DeprecationWarning:beartype.*",
    "ignore::DeprecationWarning:deal.*",
    # SQLAlchemy test class registration warnings (test isolation, not a bug)
    "ignore:This declarative base already contains a class:sqlalchemy.exc.SAWarning",
    # Async resource warnings (pre-existing test issues - TODO: fix properly)
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::ResourceWarning",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/hive"]
branch = true
parallel = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
    # CLI modules are tested via subprocess (integration tests) which doesn't
    # count toward coverage. They ARE tested, just not in-process.
    "src/hive/cli/*",
    # Templates are static content, not logic
    "src/hive/templates/*",
]

[tool.coverage.report]
# TODO: Restore to 90% once spec/diff and generators are fully tested
# Current gaps: introspection.py edge cases, spec diffing edge cases
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "assert_never",
    "typing_extensions.assert_never",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# HYPOTHESIS - PROPERTY-BASED TESTING
# =============================================================================

[tool.hypothesis]
default = "default"

[tool.hypothesis.profiles.default]
max_examples = 100
deadline = 500

[tool.hypothesis.profiles.ci]
max_examples = 1000
deadline = 1000

[tool.hypothesis.profiles.dev]
max_examples = 10
deadline = 5000

# =============================================================================
# MUTMUT - MUTATION TESTING
# =============================================================================

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "pytest"

# =============================================================================
# INTERROGATE - DOCSTRING COVERAGE
# =============================================================================

[tool.interrogate]
fail-under = 95
verbose = 1
quiet = false
color = true
omit-covered-files = false

ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = true

exclude = [
    "setup.py",
    "conftest.py",
    "tests",
    "docs",
]

# =============================================================================
# VULTURE - DEAD CODE DETECTION
# =============================================================================

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = [
    "*/.venv/*",
    "*/tests/*",
]

# =============================================================================
# IMPORT-LINTER - ARCHITECTURE ENFORCEMENT
# =============================================================================

[tool.importlinter]
root_package = "hive"

[[tool.importlinter.contracts]]
name = "Types should not import from core implementation"
type = "forbidden"
source_modules = ["hive.types"]
forbidden_modules = ["hive.core", "hive.runtime", "hive.generators"]

[[tool.importlinter.contracts]]
name = "Contracts should not import from generators"
type = "forbidden"
source_modules = ["hive.contracts"]
forbidden_modules = ["hive.generators"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "hive.generators",
    "hive.runtime",
    "hive.core",
    "hive.contracts",
    "hive.types",
]

# =============================================================================
# BANDIT - SECURITY LINTING
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = []

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/conftest.py"]
